# 의존성·이미지·액션 갱신 PR (D17-③) — 주 1회, 보안 갱신은 즉시(Dependabot 기본)
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # pnpm-lock.yaml (콘솔)
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # package-lock.json (Playwright 스모크)
    directory: /web/e2e
    schedule: { interval: weekly }
  - package-ecosystem: docker       # Dockerfile 베이스 이미지(digest 고정)
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
