apiVersion: v1
kind: Pod
metadata:
  name: {{ include "agentnexus.fullname" . }}-test-health
  labels: {{- include "agentnexus.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "agentnexus.podCommon" . | nindent 2 }}
  containers:
    - name: health
      image: {{ include "agentnexus.image" (list . .Values.image) }}
      command: ["python", "-c"]
      args:
        - |
          import json, urllib.request
          base = "http://{{ include "agentnexus.fullname" . }}-api:{{ .Values.service.port }}"
          h = json.load(urllib.request.urlopen(base + "/health", timeout=10))
          assert h["status"] == "ok" and h["db"]["status"] == "ok", h
          card = json.load(urllib.request.urlopen(base + "/.well-known/agent-card.json", timeout=10))
          assert card.get("name"), card
          print("ok", h)
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
