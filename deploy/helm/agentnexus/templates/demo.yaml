{{- if .Values.demo.enabled }}
{{- $fn := include "agentnexus.fullname" . -}}
{{- $root := . -}}
{{- range $c := list (dict "name" "mcp-servers" "port" 8100 "module" "app.builtin.mcp_servers:app") (dict "name" "a2a-demo" "port" 8200 "module" "app.builtin.a2a_agent:app") }}
---
# 데모 참조 서버 — backend 전용(NetworkPolicy: api 에서만 수신). DB 자격증명은 주지 않는다(최소 권한).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-{{ $c.name }}
  labels: {{- include "agentnexus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "agentnexus.selector" (list $root $c.name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agentnexus.selector" (list $root $c.name) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}  # 데모 워크로드 시크릿 교체 시 재기동 (D20-③)
        {{- with $root.Values.secrets.rotationNonce }}
        agentnexus/rotation-nonce: {{ . | quote }}
        {{- end }}
    spec:
      {{- include "agentnexus.podCommon" $root | nindent 6 }}
      containers:
        - name: {{ $c.name }}
          image: {{ include "agentnexus.image" (list $root $root.Values.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["uvicorn", "{{ $c.module }}", "--host", "0.0.0.0", "--port", "{{ $c.port }}"]
          env:
            - { name: AGENTNEXUS_ROLE, value: {{ $c.name }} }
            - { name: UVICORN_WORKERS, value: "1" }  # 데모 서버 상태는 프로세스 메모리 — ConfigMap 의 api 워커 수를 따르지 않게
            {{- range $k := list "PUBLIC_BASE_URL" "IDP_INTERNAL_URL" "GATEWAY_URL" "MCP_SERVERS_URL" "A2A_DEMO_URL" "SPAN_PROCESSOR" "LOG_LEVEL" "DATA_DIR" "APP_ENV" }}
            - name: {{ $k }}
              valueFrom: { configMapKeyRef: { name: {{ $fn }}-config, key: {{ $k }} } }
            {{- end }}
            - name: OTLP_INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "agentnexus.secretName" $root }}, key: OTLP_INGEST_TOKEN } }
            {{- if eq $c.name "a2a-demo" }}
            - name: A2A_DEMO_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "agentnexus.secretName" $root }}, key: A2A_DEMO_CLIENT_SECRET } }
            {{- end }}
          ports:
            - { name: http, containerPort: {{ $c.port }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml $root.Values.demo.resources | nindent 12 }}
          securityContext: {{- toYaml $root.Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-{{ $c.name }}
  labels: {{- include "agentnexus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  selector: {{- include "agentnexus.selector" (list $root $c.name) | nindent 4 }}
  ports:
    - { name: http, port: {{ $c.port }}, targetPort: http }
{{- end }}
{{- end }}
